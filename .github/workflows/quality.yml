name: Code Quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","generic"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rice-guard
        run: curl -fsSL https://install.rice-guard.dev | sh
      - name: Scan
        run: rice-guard scan . --diff-only
        env:
          RICE_GUARD_FAIL_ON: high
